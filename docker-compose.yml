# HuaJian_Pay production-oriented Compose
#
# API only (default):
#   cp .env.production.example .env
#   docker compose up -d --build
#   curl http://127.0.0.1:8080/health
#
# API + Admin SPA reverse proxy (profile web):
#   docker compose --profile web up -d --build
#   open http://SERVER_IP:8088/
#   Host TLS sample: deploy/nginx-host.conf
#
# Notes:
# - SQLite only (MySQL not implemented)
# - Secrets via .env / env_file; never bake into image
# - API bound to 127.0.0.1 by default (host reverse proxy recommended)

name: huajian-pay

x-api-env: &api-env
  NODE_ENV: production
  HOST: 0.0.0.0
  PORT: 8080
  DB_DRIVER: sqlite
  DB_DSN: /data/huajian_pay.db

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: huajian-pay-api:local
    container_name: huajian-pay-api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      <<: *api-env
    volumes:
      - huajian_pay_data:/data
    ports:
      - "${API_HOST_BIND:-127.0.0.1}:${API_HOST_PORT:-8080}:8080"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - huajian

  admin-dist-init:
    image: huajian-pay-api:local
    container_name: huajian-pay-admin-dist-init
    profiles: ["web"]
    user: "0:0"
    volumes:
      - admin_dist:/out
    entrypoint:
      - /bin/sh
      - -ec
      - |
        if [ ! -f /app/admin-dist/index.html ]; then
          echo "admin-dist missing in image; rebuild with Dockerfile that copies admin SPA" >&2
          exit 1
        fi
        rm -rf /out/*
        cp -a /app/admin-dist/. /out/
        echo "admin-dist synced"
    depends_on:
      api:
        condition: service_started
    networks:
      - huajian
    restart: "no"

  admin-static:
    image: nginx:1.27-alpine
    container_name: huajian-pay-admin
    profiles: ["web"]
    restart: unless-stopped
    depends_on:
      admin-dist-init:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    volumes:
      - admin_dist:/usr/share/nginx/html:ro
      - ./deploy/nginx-compose.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${ADMIN_HOST_BIND:-0.0.0.0}:${ADMIN_HOST_PORT:-8088}:80"
    networks:
      - huajian

volumes:
  huajian_pay_data:
    name: huajian_pay_data
  admin_dist:
    name: huajian_pay_admin_dist

networks:
  huajian:
    name: huajian_pay_net
