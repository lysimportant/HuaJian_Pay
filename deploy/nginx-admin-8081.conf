# HuaJian_Pay Admin SPA on host port 8081
# - Serves static dist (default root: /var/www/huajian-admin)
# - Reverse-proxies API to Docker API at 127.0.0.1:8080
#
# Setup:
#   sudo mkdir -p /var/www/huajian-admin
#   # copy admin dist into /var/www/huajian-admin/
#   #   docker create --name hj-tmp huajian-pay-api:local
#   #   sudo docker cp hj-tmp:/app/admin-dist/. /var/www/huajian-admin/
#   #   docker rm hj-tmp
#   sudo cp deploy/nginx-admin-8081.conf /etc/nginx/conf.d/huajian-admin-8081.conf
#   # or sites-available + sites-enabled on Debian/Ubuntu
#   sudo nginx -t && sudo systemctl reload nginx
#   curl -sS http://127.0.0.1:8081/
#   curl -sS http://127.0.0.1:8081/health
#
# Open firewall if needed: 8081/tcp
# Later put HTTPS on 443 and proxy_pass http://127.0.0.1:8081; or merge into nginx-host.conf

upstream huajian_api_local {
  server 127.0.0.1:8080;
  keepalive 16;
}

server {
  listen 8081;
  listen [::]:8081;
  server_name _;

  root /var/www/huajian-admin;
  index index.html;

  client_max_body_size 4m;

  # --- Admin REST (same origin as SPA) ---
  location /admin/api/ {
    proxy_pass http://huajian_api_local;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # --- Payment / public / health ---
  location ~ ^/(submit\.php|mapi\.php|api\.php|health|pay/|api/v1/|channels/) {
    proxy_pass http://huajian_api_local;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Wechatpay-Signature $http_wechatpay_signature;
    proxy_set_header Wechatpay-Timestamp $http_wechatpay_timestamp;
    proxy_set_header Wechatpay-Nonce $http_wechatpay_nonce;
    proxy_set_header Wechatpay-Serial $http_wechatpay_serial;
    proxy_set_header Wechatpay-Signature-Type $http_wechatpay_signature_type;
    proxy_read_timeout 60s;
  }

  # --- Admin SPA (dist) ---
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Optional: avoid caching index during rollout
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}
