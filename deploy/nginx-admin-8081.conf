# HuaJian Admin on host port 8081
# Static SPA: /opt/HuaJian_Pay/frontend
# API: Docker 127.0.0.1:8080
#
# Usage:
#   copy this server block into your site config
#   nginx -t && nginx -s reload
#
# Open: http://SERVER_IP:8081/

server {
    listen 8081;
    server_name huajian;
    root /opt/HuaJian_Pay/frontend;
    index index.html;

    client_max_body_size 4m;

    # ========== API / pay callbacks -> Docker API ==========
    # Only proxy these paths. Never proxy location /.

    location /admin/api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Alipay async notify
    location = /channels/alipay/notify {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Content-Type $content_type;
        proxy_pass_request_body on;
        proxy_read_timeout 60s;
    }

    # Other channel callbacks (WeChat etc.)
    location /channels/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Wechatpay-Signature $http_wechatpay_signature;
        proxy_set_header Wechatpay-Timestamp $http_wechatpay_timestamp;
        proxy_set_header Wechatpay-Nonce $http_wechatpay_nonce;
        proxy_set_header Wechatpay-Serial $http_wechatpay_serial;
        proxy_set_header Wechatpay-Signature-Type $http_wechatpay_signature_type;
        proxy_read_timeout 60s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /submit.php {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /mapi.php {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /api.php {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location ^~ /pay/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location ^~ /api/v1/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ========== static assets (optional cache) ==========

    location ~* \.(gif|jpg|jpeg|png|bmp|swf|ico|svg|woff|woff2)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(js|css)$ {
        expires 12h;
        access_log off;
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }

    # ========== Admin SPA ==========
    # Required. Do not put proxy_pass here.

    location / {
        try_files $uri $uri/ /index.html;
    }
}
