# Host Nginx: HTTPS terminate → Compose profile web (127.0.0.1:8088)
# Domain for this deployment: pay.sui.lianghj.top
#
# Prerequisites:
#   1) DNS A/AAAA: pay.sui.lianghj.top → server public IP
#   2) docker compose --profile web up -d --build
#   3) certbot (or other ACME) issued certs
#
# Install (Debian/Ubuntu example):
#   sudo cp deploy/nginx-host.conf /etc/nginx/sites-available/huajian-pay.conf
#   sudo ln -sf /etc/nginx/sites-available/huajian-pay.conf /etc/nginx/sites-enabled/
#   # first-time cert (HTTP-01): temporarily comment SSL server or use certbot --nginx
#   sudo certbot --nginx -d pay.sui.lianghj.top
#   sudo nginx -t && sudo systemctl reload nginx

upstream huajian_local {
  server 127.0.0.1:8088;
  keepalive 16;
}

# HTTP → HTTPS + ACME challenge path
server {
  listen 80;
  listen [::]:80;
  server_name pay.sui.lianghj.top;

  location /.well-known/acme-challenge/ {
    root /var/www/html;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name pay.sui.lianghj.top;

  # After certbot, these paths are standard Let's Encrypt locations:
  ssl_certificate     /etc/letsencrypt/live/pay.sui.lianghj.top/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/pay.sui.lianghj.top/privkey.pem;
  # include /etc/letsencrypt/options-ssl-nginx.conf;
  # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  # Hardening (safe defaults; adjust if you already have global SSL policy)
  ssl_session_timeout 1d;
  ssl_session_cache shared:SSL:10m;
  ssl_protocols TLSv1.2 TLSv1.3;

  client_max_body_size 4m;

  # Security headers (Admin SPA + API same host)
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location / {
    proxy_pass http://huajian_local;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    # WeChat APIv3 notify headers must pass through
    proxy_set_header Wechatpay-Signature $http_wechatpay_signature;
    proxy_set_header Wechatpay-Timestamp $http_wechatpay_timestamp;
    proxy_set_header Wechatpay-Nonce $http_wechatpay_nonce;
    proxy_set_header Wechatpay-Serial $http_wechatpay_serial;
    proxy_set_header Wechatpay-Signature-Type $http_wechatpay_signature_type;
    proxy_read_timeout 60s;
  }
}
