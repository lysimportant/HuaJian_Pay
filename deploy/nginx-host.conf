# Host Nginx — HTTPS + Admin static + reverse proxy API only
# Domain: pay.sui.lianghj.top
#
# Topology (recommended):
#   docker compose up -d --build          # API → 127.0.0.1:8080
#   pnpm --filter @huajian/admin build
#   rsync apps/admin/dist/ → /var/www/huajian-admin/
#   this file → sites-enabled + certbot
#
#   https://pay.sui.lianghj.top/          → Admin SPA (static)
#   /admin/api /health /channels/ …       → 127.0.0.1:8080 (Docker API)

upstream huajian_api {
  server 127.0.0.1:8080;
  keepalive 16;
}

server {
  listen 80;
  listen [::]:80;
  server_name pay.sui.lianghj.top;

  location /.well-known/acme-challenge/ {
    root /var/www/html;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name pay.sui.lianghj.top;

  ssl_certificate     /etc/letsencrypt/live/pay.sui.lianghj.top/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/pay.sui.lianghj.top/privkey.pem;
  # include /etc/letsencrypt/options-ssl-nginx.conf;
  # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  ssl_session_timeout 1d;
  ssl_session_cache shared:SSL:10m;
  ssl_protocols TLSv1.2 TLSv1.3;

  client_max_body_size 4m;

  root /var/www/huajian-admin;
  index index.html;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # --- API (Docker) ---
  location /admin/api/ {
    proxy_pass http://huajian_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 60s;
  }

  location ~ ^/(submit\.php|mapi\.php|api\.php|health|pay/|api/v1/|channels/) {
    proxy_pass http://huajian_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Wechatpay-Signature $http_wechatpay_signature;
    proxy_set_header Wechatpay-Timestamp $http_wechatpay_timestamp;
    proxy_set_header Wechatpay-Nonce $http_wechatpay_nonce;
    proxy_set_header Wechatpay-Serial $http_wechatpay_serial;
    proxy_set_header Wechatpay-Signature-Type $http_wechatpay_signature_type;
    proxy_read_timeout 60s;
  }

  # --- Admin SPA ---
  location / {
    try_files $uri $uri/ /index.html;
  }
}
