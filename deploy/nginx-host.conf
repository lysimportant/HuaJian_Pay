# Host Nginx sample: terminate HTTPS, reverse-proxy to Compose.
# Prefer profile web → 127.0.0.1:8088 (Admin SPA + API paths).
# API-only setup → change upstream to 127.0.0.1:8080 and serve Admin elsewhere.
#
# 1) Replace pay.example.com + cert paths
# 2) sudo ln -s ... /etc/nginx/sites-enabled/
# 3) sudo nginx -t && sudo systemctl reload nginx

upstream huajian_local {
  server 127.0.0.1:8088;
  keepalive 16;
}

server {
  listen 80;
  listen [::]:80;
  server_name pay.example.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name pay.example.com;

  # ssl_certificate     /etc/letsencrypt/live/pay.example.com/fullchain.pem;
  # ssl_certificate_key /etc/letsencrypt/live/pay.example.com/privkey.pem;
  # include /etc/letsencrypt/options-ssl-nginx.conf;
  # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  client_max_body_size 4m;

  location / {
    proxy_pass http://huajian_local;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Wechatpay-Signature $http_wechatpay_signature;
    proxy_set_header Wechatpay-Timestamp $http_wechatpay_timestamp;
    proxy_set_header Wechatpay-Nonce $http_wechatpay_nonce;
    proxy_set_header Wechatpay-Serial $http_wechatpay_serial;
    proxy_set_header Wechatpay-Signature-Type $http_wechatpay_signature_type;
    proxy_read_timeout 60s;
  }
}
