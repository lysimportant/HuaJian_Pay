# Alipay notify reverse proxy snippet for host Nginx
# Domain: pay.sui.lianghj.top
# Upstream API: Docker compose api on 127.0.0.1:8080
#
# Public notify URL (fill in Alipay open platform / .env):
#   https://pay.sui.lianghj.top/channels/alipay/notify
#
# Paste the location blocks into the same server { listen 443; server_name pay.sui.lianghj.top; }
# Or use the full file: deploy/nginx-host.conf
#
# Notes:
# - Alipay server-notify is usually application/x-www-form-urlencoded POST
# - Do NOT force HTTPS body rewrite; pass raw body through
# - API must respond plain text: success / failure

# Prefer a dedicated location (clearer than a big regex)
location = /channels/alipay/notify {
  proxy_pass http://127.0.0.1:8080;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Content-Type $content_type;
  proxy_pass_request_body on;
  proxy_pass_request_headers on;
  proxy_read_timeout 60s;
  # Avoid buffering weirdness on form posts
  proxy_request_buffering on;
  client_max_body_size 1m;
}

# Optional: whole channels prefix (alipay + wechat)
location /channels/ {
  proxy_pass http://127.0.0.1:8080;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  # WeChat APIv3 headers (harmless for Alipay)
  proxy_set_header Wechatpay-Signature $http_wechatpay_signature;
  proxy_set_header Wechatpay-Timestamp $http_wechatpay_timestamp;
  proxy_set_header Wechatpay-Nonce $http_wechatpay_nonce;
  proxy_set_header Wechatpay-Serial $http_wechatpay_serial;
  proxy_set_header Wechatpay-Signature-Type $http_wechatpay_signature_type;
  proxy_read_timeout 60s;
}
