# Compose profile `web`: Admin SPA + reverse proxy to `api` service.
# TLS is intentionally NOT terminated here — put host Nginx/Caddy in front
# (see deploy/nginx-host.conf) and point upstream to 127.0.0.1:8088 or :8080.

upstream huajian_api {
  server api:8080;
  keepalive 16;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 4m;

  # --- Admin REST ---
  location /admin/api/ {
    proxy_pass http://huajian_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # --- Payment classic / public / channels (same host optional) ---
  location ~ ^/(submit\.php|mapi\.php|api\.php|health|pay/|api/v1/|channels/) {
    proxy_pass http://huajian_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # WeChat APIv3 needs raw body + signature headers intact
    proxy_set_header Wechatpay-Signature $http_wechatpay_signature;
    proxy_set_header Wechatpay-Timestamp $http_wechatpay_timestamp;
    proxy_set_header Wechatpay-Nonce $http_wechatpay_nonce;
    proxy_set_header Wechatpay-Serial $http_wechatpay_serial;
    proxy_set_header Wechatpay-Signature-Type $http_wechatpay_signature_type;
    proxy_read_timeout 60s;
  }

  # --- Admin SPA ---
  location / {
    try_files $uri $uri/ /index.html;
  }
}
