# Temporary HTTP-only site for first certificate issue (certbot webroot/nginx).
# Use this BEFORE ssl_certificate files exist.
#
#   sudo cp deploy/nginx-host-bootstrap.conf /etc/nginx/sites-available/huajian-pay.conf
#   sudo ln -sf /etc/nginx/sites-available/huajian-pay.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d pay.sui.lianghj.top
#   # certbot will rewrite SSL; or replace with deploy/nginx-host.conf after certs exist

upstream huajian_local {
  server 127.0.0.1:8088;
  keepalive 16;
}

server {
  listen 80;
  listen [::]:80;
  server_name pay.sui.lianghj.top;

  location /.well-known/acme-challenge/ {
    root /var/www/html;
  }

  location / {
    proxy_pass http://huajian_local;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Wechatpay-Signature $http_wechatpay_signature;
    proxy_set_header Wechatpay-Timestamp $http_wechatpay_timestamp;
    proxy_set_header Wechatpay-Nonce $http_wechatpay_nonce;
    proxy_set_header Wechatpay-Serial $http_wechatpay_serial;
    proxy_set_header Wechatpay-Signature-Type $http_wechatpay_signature_type;
    proxy_read_timeout 60s;
  }
}
