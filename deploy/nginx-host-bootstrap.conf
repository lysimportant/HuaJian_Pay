# First-time HTTP site (before TLS cert exists).
# API-only: reverse proxy to Docker API + optional static Admin root.
#
#   sudo mkdir -p /var/www/huajian-admin
#   # copy apps/admin/dist/* into /var/www/huajian-admin/
#   sudo cp deploy/nginx-host-bootstrap.conf /etc/nginx/sites-available/huajian-pay.conf
#   sudo ln -sf /etc/nginx/sites-available/huajian-pay.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d pay.sui.lianghj.top
#   sudo cp deploy/nginx-host.conf /etc/nginx/sites-available/huajian-pay.conf
#   sudo nginx -t && sudo systemctl reload nginx

upstream huajian_api {
  server 127.0.0.1:8080;
  keepalive 16;
}

server {
  listen 80;
  listen [::]:80;
  server_name pay.sui.lianghj.top;

  root /var/www/huajian-admin;
  index index.html;

  location /.well-known/acme-challenge/ {
    root /var/www/html;
  }

  location /admin/api/ {
    proxy_pass http://huajian_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  location ~ ^/(submit\.php|mapi\.php|api\.php|health|pay/|api/v1/|channels/) {
    proxy_pass http://huajian_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Wechatpay-Signature $http_wechatpay_signature;
    proxy_set_header Wechatpay-Timestamp $http_wechatpay_timestamp;
    proxy_set_header Wechatpay-Nonce $http_wechatpay_nonce;
    proxy_set_header Wechatpay-Serial $http_wechatpay_serial;
    proxy_set_header Wechatpay-Signature-Type $http_wechatpay_signature_type;
    proxy_read_timeout 60s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
