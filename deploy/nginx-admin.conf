# Optional Admin SPA reverse proxy (compose profile admin-ui)
# Proxies /admin/api to the API container; serves static files from admin dist.

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Admin REST API → api service (compose network DNS name "api")
  location /admin/api/ {
    proxy_pass http://api:8080/admin/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }
}
